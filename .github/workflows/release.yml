name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to create (e.g. v0.1.4)'
        required: true
        type: string

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  test:
    uses: ./.github/workflows/go.yml

  release:
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for tags and releases

      # Set up environment (needed for 'go list')
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      # Tag and push the new version
      - name: Create Tag and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ inputs.version }}
          git push origin ${{ inputs.version }}

      # Publish/index to the public Go proxy
      - name: Request Go Proxy indexing
        run: |
          GOPROXY=https://proxy.golang.org go list -m github.com/audunhov/mapper@${{ inputs.version }}

      # Create GitHub Release
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ inputs.version }} --generate-notes
